server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;

    # Asset URLs carry ?v=<content hash> (stamped in the Dockerfile), so they can be cached for a
    # long time: a changed file always gets a new URL.
    location ~* \.(js|css|json|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages are always revalidated, so browsers pick up new asset versions right away.
    # (An add_header here replaces the server-level ones, so the page headers are repeated.)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
