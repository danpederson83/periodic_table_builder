# Runs the site plus a Cloudflare Tunnel, so nothing needs to be port-forwarded.
#   1. Create a tunnel in the Cloudflare dashboard (Zero Trust → Networks → Tunnels) and copy its token.
#   2. Put TUNNEL_TOKEN=... in a .env file next to this one.
#   3. In the tunnel's "Public hostname" settings, route your domain to http://web:80
#   4. docker compose up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8083:80"   # optional: for LAN access / testing. Remove if you only want the tunnel.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
